<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Order Forge — sc2.eole.me</title>
<meta name="description" content="Déposez un replay StarCraft II, récupérez sa build order en Markdown, prête à coller dans Claude.">
<meta name="theme-color" content="#080b11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>
/* Le thème est posé avant le premier rendu : sans cela, une préférence claire
   verrait passer un éclair sombre le temps que le module se charge. Volontairement
   inline et synchrone — c'est le seul endroit où cela se justifie. */
(function () {
  try {
    var saved = localStorage.getItem("preferred-theme") || "system";
    var resolved = saved === "light" || saved === "dark" ? saved
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.classList.add("theme-" + resolved);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", resolved === "dark" ? "#080b11" : "#f8fafc");
  } catch (e) { /* stockage indisponible : la media query prend le relais */ }
})();
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <div>
      <div class="wordmark"><span class="chev">&#9654;</span>Build Order Forge</div>
      <p class="tagline" data-i18n="tagline"></p>
    </div>

    <div class="controls">
      <div class="seg" role="group" data-i18n-aria="theme_system">
        <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n-title="theme_light" data-i18n-aria="theme_light"><span class="glyph">&#9788;</span></button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n-title="theme_dark" data-i18n-aria="theme_dark"><span class="glyph">&#9790;</span></button>
        <button type="button" data-theme-choice="system" aria-pressed="true" data-i18n-title="theme_system" data-i18n-aria="theme_system">Auto</button>
      </div>
      <div class="seg" role="group" data-i18n-aria="lang_switch">
        <button type="button" data-locale-choice="fr" aria-pressed="true" lang="fr">FR</button>
        <button type="button" data-locale-choice="en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="panel_replay"></h2>
      <span class="eyebrow" data-i18n="privacy"></span>
    </div>

    <div class="drop" id="drop" tabindex="0" role="button" data-i18n-aria="drop_aria">
      <div class="big" data-i18n="drop_big"></div>
      <div class="small" data-i18n="drop_small"></div>
      <div class="file" id="chosen"></div>
    </div>
    <input type="file" id="file" accept=".SC2Replay">

    <div class="opts">
      <div class="field">
        <label for="cutoff" data-i18n="label_cutoff"></label>
        <input type="text" id="cutoff" data-i18n-placeholder="ph_cutoff" inputmode="numeric">
      </div>
      <div class="field">
        <label for="players" data-i18n="label_players"></label>
        <input type="text" id="players" data-i18n-placeholder="ph_players">
      </div>
      <div class="field">
        <label for="format" data-i18n="label_format"></label>
        <select id="format">
          <option value="table" data-i18n="opt_table"></option>
          <option value="list" data-i18n="opt_list"></option>
          <option value="raw" data-i18n="opt_raw"></option>
        </select>
      </div>
      <div class="field">
        <label for="workers" data-i18n="label_workers"></label>
        <select id="workers">
          <option value="summary" data-i18n="opt_summary"></option>
          <option value="all" data-i18n="opt_all"></option>
          <option value="none" data-i18n="opt_none"></option>
        </select>
      </div>
      <label class="check" for="prompt">
        <input type="checkbox" id="prompt" checked>
        <span data-i18n="check_prompt"></span>
      </label>
    </div>

    <div class="actions">
      <button class="btn primary" id="go" disabled data-i18n="btn_extract"></button>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="panel hidden" id="result">
    <div class="panel-head">
      <h2 data-i18n="panel_markdown"></h2>
      <span class="eyebrow" id="timing"></span>
    </div>
    <div class="meta" id="meta"></div>
    <pre class="out" id="out"></pre>
    <div class="actions">
      <button class="btn primary" id="copy" data-i18n="btn_copy"></button>
      <button class="btn" id="download" data-i18n="btn_download"></button>
      <span class="hint" id="copied"></span>
    </div>
  </section>

  <section class="panel hidden" id="failure">
    <div class="panel-head"><h2 data-i18n="panel_failure"></h2></div>
    <p class="error" id="errmsg"></p>
  </section>
</main>

<footer>
  <span data-i18n="footer"></span>
  <a href="https://github.com/gnueole/eoleme-sc2-build-order" data-i18n="footer_source"></a> ·
  <a href="https://eole.me">eole.me</a>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
